<!DOCTYPE html>
<!--
  ui/index.html — the entire web frontend, in one file.

  A build-step-free React app: React, Babel, and a couple of small libraries load
  from a CDN and the JSX below is transpiled in the browser. No npm, no bundler —
  app.py serves this file and it runs.

  Aesthetic: "Warm Radio" — warm paper, espresso ink, rust/teal/mustard accents,
  Fraunces display serif. Built for *discovery*: browse the shelf, explore topics,
  and ask a question to get an answer grounded in real transcripts (with receipts).
  Talks to the FastAPI backend over /api/*.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podcast Search — discover what was actually said</title>
<meta name="description" content="Ask a shelf of podcasts a question and get an answer grounded in real transcripts — with the exact episode and timestamp behind every claim.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 440 220'><path d='M100 145Q100 45 220 38Q340 45 340 145' fill='none' stroke='%23C8542B' stroke-width='18' stroke-linecap='round'/><rect x='68' y='118' width='50' height='68' rx='14' fill='%23C8542B'/><rect x='74' y='124' width='38' height='56' rx='10' fill='%23E0A52E'/><rect x='80' y='131' width='26' height='42' rx='7' fill='%23C8542B'/><rect x='322' y='118' width='50' height='68' rx='14' fill='%23C8542B'/><rect x='328' y='124' width='38' height='56' rx='10' fill='%23E0A52E'/><rect x='334' y='131' width='26' height='42' rx='7' fill='%23C8542B'/><circle cx='170' cy='155' r='42' fill='none' stroke='%23C8542B' stroke-width='8'/><circle cx='170' cy='155' r='34' fill='%23FBF4E6'/><circle cx='170' cy='155' r='22' fill='%23241C14'/><circle cx='270' cy='155' r='42' fill='none' stroke='%23C8542B' stroke-width='8'/><circle cx='270' cy='155' r='34' fill='%23FBF4E6'/><circle cx='270' cy='155' r='22' fill='%23241C14'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/marked@14.1.4/marked.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js" crossorigin></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --paper:#FBF4E6; --paper-2:#F3E8D2; --card:#FFFDF7;
  --ink:#241C14; --ink-2:#5A4F42; --ink-3:#9C9080;
  --rust:#C8542B; --rust-d:#A23C1B; --teal:#2E8B86; --teal-d:#1F6E69;
  --mustard:#E0A52E; --mustard-d:#B97F12; --berry:#9C3B52;
  --line:rgba(36,28,20,.12); --line-2:rgba(36,28,20,.07);
  --shadow:0 1px 2px rgba(36,28,20,.04), 0 12px 32px -12px rgba(36,28,20,.18);
  --shadow-lg:0 2px 4px rgba(36,28,20,.05), 0 30px 60px -22px rgba(36,28,20,.30);
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Plus Jakarta Sans',-apple-system,system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --font-hand:'Caveat',cursive;
  --r:18px; --r-sm:11px;
}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body); background:var(--paper); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.55; letter-spacing:-.01em;
  min-height:100dvh; overflow-x:hidden;
}
/* warm paper grain + soft top vignette */
body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(224,165,46,.10), transparent 55%),
    radial-gradient(90% 60% at 100% 0%, rgba(46,139,134,.07), transparent 50%);}
body::after{content:'';position:fixed;inset:0;z-index:-1;opacity:.035;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
::selection{background:var(--mustard);color:var(--ink)}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:50;backdrop-filter:blur(10px);
  background:linear-gradient(180deg,rgba(251,244,230,.94),rgba(251,244,230,.72));
  border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:20px;height:68px}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.brand-name{font-family:var(--font-display);font-weight:600;font-size:21px;letter-spacing:-.02em}
.brand-name b{color:var(--rust);font-weight:600}
.nav{display:flex;align-items:center;gap:4px;margin-left:8px}
.nav a{font-weight:600;font-size:14.5px;color:var(--ink-2);padding:8px 14px;border-radius:var(--r-full,999px);
  border-radius:999px;transition:.18s}
.nav a:hover{color:var(--ink);background:rgba(36,28,20,.05)}
.nav a.on{color:var(--rust);background:rgba(200,84,43,.10)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.live-pill{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11.5px;
  font-weight:500;color:var(--teal-d);background:rgba(46,139,134,.12);padding:6px 11px;border-radius:999px}
.live-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);
  box-shadow:0 0 0 0 rgba(46,139,134,.5);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,139,134,.5)}70%{box-shadow:0 0 0 8px rgba(46,139,134,0)}100%{box-shadow:0 0 0 0 rgba(46,139,134,0)}}
.ic-link{display:inline-flex;color:var(--ink-2);transition:.18s}.ic-link:hover{color:var(--ink);transform:translateY(-1px)}

/* ---------- mascot ---------- */
.mascot{display:block}
.mascot .eyeball{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
.mascot .eyeball.b{animation-delay:.12s}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}

/* equalizer */
.eq{display:inline-flex;align-items:flex-end;gap:3px;height:18px}
.eq i{width:3px;background:var(--rust);border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s;background:var(--teal)}
.eq i:nth-child(3){animation-delay:.4s;background:var(--mustard)}
.eq i:nth-child(4){animation-delay:.1s;background:var(--rust)}
.eq i:nth-child(5){animation-delay:.3s;background:var(--teal)}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}

/* ---------- buttons / chips ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;
  background:var(--ink);color:var(--paper);padding:13px 22px;border-radius:999px;transition:.2s;
  box-shadow:0 6px 16px -6px rgba(36,28,20,.5)}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px -8px rgba(36,28,20,.55)}
.btn.rust{background:var(--rust)}.btn.rust:hover{background:var(--rust-d)}
.chip{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13.5px;color:var(--ink-2);
  background:var(--card);border:1px solid var(--line);padding:8px 15px;border-radius:999px;transition:.18s;cursor:pointer}
.chip:hover{color:var(--ink);border-color:var(--rust);background:#fff;transform:translateY(-1px)}
.kicker{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11.5px;
  font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--rust)}

/* ---------- hero ---------- */
.hero{position:relative;padding:62px 0 34px}
.hero-grid{display:grid;grid-template-columns:1.35fr .9fr;gap:40px;align-items:center}
.hero h1{font-family:var(--font-display);font-weight:600;font-size:clamp(38px,5.4vw,62px);
  line-height:1.02;letter-spacing:-.025em;margin:18px 0 0}
.hero h1 em{font-style:italic;color:var(--rust)}
.hero .u{position:relative;white-space:nowrap}
.hero .u svg{position:absolute;left:0;bottom:-10px;width:100%;height:12px;color:var(--mustard)}
.hero p.lead{font-size:18.5px;color:var(--ink-2);max-width:540px;margin-top:18px;font-weight:500}
.hero-art{position:relative;display:flex;justify-content:center;align-items:center}
.disc{position:relative}
.disc .ring{position:absolute;border-radius:50%;border:1px dashed rgba(36,28,20,.16);inset:0;margin:auto;
  animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* search bar */
.searchbar{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--ink);
  border-radius:999px;padding:7px 8px 7px 22px;box-shadow:var(--shadow);margin-top:30px;max-width:600px;transition:.2s}
.searchbar:focus-within{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.searchbar input{flex:1;border:none;background:none;outline:none;font-family:inherit;font-size:17px;
  font-weight:500;color:var(--ink)}
.searchbar input::placeholder{color:var(--ink-3)}
.searchbar .go{width:46px;height:46px;border-radius:50%;background:var(--rust);color:#fff;display:grid;
  place-items:center;transition:.2s;flex:none}
.searchbar .go:hover{background:var(--rust-d);transform:scale(1.05)}
.examples{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px;max-width:600px}
.ex-lbl{font-family:var(--font-hand);font-size:19px;color:var(--ink-3);align-self:center;margin-right:2px}

/* ---------- sections ---------- */
.sec{padding:46px 0;border-top:1px solid var(--line-2)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}
.sec-head h2{font-family:var(--font-display);font-weight:600;font-size:clamp(26px,3.2vw,34px);letter-spacing:-.02em;line-height:1.05}
.sec-head p{color:var(--ink-2);font-size:15px;font-weight:500;margin-top:4px}
.see-all{font-weight:700;font-size:14px;color:var(--rust);display:inline-flex;align-items:center;gap:5px}
.see-all:hover{gap:9px}

/* stat strip */
.statstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:30px}
.statstrip .cell{background:var(--card);padding:20px 22px}
.statstrip .num{font-family:var(--font-display);font-weight:600;font-size:32px;line-height:1;letter-spacing:-.02em}
.statstrip .lbl{font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:6px;text-transform:uppercase;letter-spacing:.06em}

/* show shelf */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:18px}
.show{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;transition:.22s;cursor:pointer;position:relative;overflow:hidden}
.show:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--ink)}
.show .cover{aspect-ratio:1;border-radius:12px;background:linear-gradient(135deg,var(--paper-2),#E8D9BC);
  display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.show .cover img{width:100%;height:100%;object-fit:cover}
.show .nm{font-weight:700;font-size:14.5px;margin-top:11px;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.show .ct{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:4px;font-family:var(--font-mono)}

/* episode card */
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.epcard{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;transition:.2s;cursor:pointer}
.epcard:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--ink)}
.th{width:62px;height:62px;border-radius:11px;flex:none;background:var(--paper-2);overflow:hidden;border:1px solid var(--line);display:grid;place-items:center}
.th img{width:100%;height:100%;object-fit:cover}
.epcard .tt{font-weight:700;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.epcard .sh{font-size:12.5px;color:var(--rust);font-weight:700;margin-top:5px}

/* ---------- search results ---------- */
.results{padding:38px 0 60px;max-width:820px;margin:0 auto}
.askedq{font-family:var(--font-display);font-weight:500;font-style:italic;font-size:clamp(24px,3.4vw,34px);
  line-height:1.15;letter-spacing:-.02em}
.grounded-tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;
  font-weight:600;color:var(--teal-d);background:rgba(46,139,134,.12);padding:6px 12px;border-radius:999px;margin-top:16px}
.answer{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:30px 32px;margin-top:18px;box-shadow:var(--shadow);font-size:16.5px;line-height:1.7}
.answer h1,.answer h2,.answer h3{font-family:var(--font-display);font-weight:600;margin:18px 0 8px;line-height:1.2}
.answer p{margin:0 0 13px}.answer strong{color:var(--ink);font-weight:700}
.answer blockquote{border-left:3px solid var(--teal);background:rgba(46,139,134,.07);
  margin:14px 0;padding:11px 18px;border-radius:0 10px 10px 0;font-style:italic;color:var(--ink-2)}
.answer ul,.answer ol{margin:0 0 13px 20px}.answer li{margin:5px 0}
.answer code{font-family:var(--font-mono);font-size:.88em;background:var(--paper-2);padding:1px 6px;border-radius:5px}
.receipts-h{font-family:var(--font-mono);font-size:11.5px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);margin:34px 0 14px;display:flex;align-items:center;gap:10px}
.receipts-h::after{content:'';flex:1;height:1px;background:var(--line)}
.receipt{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:16px 18px;margin-bottom:12px;transition:.2s;cursor:pointer}
.receipt:hover{border-color:var(--ink);transform:translateX(3px);box-shadow:var(--shadow)}
.receipt .rk{font-family:var(--font-display);font-weight:600;font-size:22px;color:var(--mustard-d);width:30px;flex:none;text-align:center}
.receipt .rt{font-weight:700;font-size:14.5px;color:var(--rust)}
.receipt .rx{font-size:14px;color:var(--ink-2);margin-top:5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.receipt .rm{display:flex;gap:12px;align-items:center;margin-top:9px;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.score-bar{width:54px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.score-bar i{display:block;height:100%;background:var(--teal)}

/* ---------- episode page ---------- */
.eptop{display:flex;gap:24px;align-items:flex-start;padding:38px 0 8px}
.eptop .big{width:128px;height:128px;border-radius:16px;flex:none;overflow:hidden;border:1px solid var(--line);background:var(--paper-2);display:grid;place-items:center;box-shadow:var(--shadow)}
.eptop .big img{width:100%;height:100%;object-fit:cover}
.eptop h1{font-family:var(--font-display);font-weight:600;font-size:clamp(26px,3.6vw,38px);line-height:1.08;letter-spacing:-.02em;margin-top:8px}
.summary{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px 28px;margin-top:24px;box-shadow:var(--shadow)}
.summary .lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--rust);font-weight:600}
.summary p{font-family:var(--font-display);font-size:19px;line-height:1.5;color:var(--ink);margin-top:10px;font-weight:400}
.disclosure{margin-top:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.disclosure summary{padding:16px 22px;font-weight:700;font-size:14.5px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
.disclosure summary::-webkit-details-marker{display:none}
.disclosure[open] summary{border-bottom:1px solid var(--line)}
.disclosure .body{padding:20px 24px;font-size:14.5px;line-height:1.75;color:var(--ink-2);max-height:440px;overflow:auto;white-space:pre-wrap}

/* ---------- pipeline page ---------- */
.pipe-hero{padding:54px 0 10px;text-align:center}
.pipe-hero h1{font-family:var(--font-display);font-weight:600;font-size:clamp(32px,4.6vw,52px);letter-spacing:-.025em;line-height:1.04}
.pipe-hero p{color:var(--ink-2);font-size:17px;font-weight:500;max-width:600px;margin:16px auto 0}
.funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:38px 0}
.fstep{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 18px;position:relative;text-align:center}
.fstep .fn{font-family:var(--font-display);font-weight:600;font-size:clamp(24px,3vw,34px);line-height:1;letter-spacing:-.02em}
.fstep .fl{font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:8px}
.fstep .fk{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px}
.fstep:not(:last-child)::after{content:'→';position:absolute;right:-12px;top:50%;transform:translateY(-50%);color:var(--rust);font-weight:700;z-index:2}
.fstep.b1{box-shadow:inset 0 3px 0 var(--rust)} .fstep.b2{box-shadow:inset 0 3px 0 var(--mustard)}
.fstep.b3{box-shadow:inset 0 3px 0 var(--teal)} .fstep.b4{box-shadow:inset 0 3px 0 var(--berry)}
.fstep.b5{box-shadow:inset 0 3px 0 var(--ink)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:10px}
.act{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.act h3{font-family:var(--font-display);font-weight:600;font-size:20px;display:flex;align-items:center;gap:10px}
.act p{font-size:14.5px;color:var(--ink-2);margin-top:10px}
.act .tag{font-family:var(--font-mono);font-size:11px;color:var(--rust);font-weight:600}
/* live tape log */
.tapelog{background:#241C14;color:#F3E8D2;border-radius:var(--r);padding:6px;margin-top:14px;font-family:var(--font-mono);box-shadow:var(--shadow-lg)}
.tapelog .bar{display:flex;align-items:center;gap:8px;padding:11px 14px;font-size:11.5px;color:#C9BBA3;border-bottom:1px solid rgba(243,232,210,.1)}
.tapelog .feed{max-height:230px;overflow:auto;padding:6px 4px}
.tapelog .ev{display:flex;gap:12px;padding:7px 12px;font-size:12.5px;align-items:baseline}
.tapelog .ev .ph{color:var(--mustard);font-weight:500;flex:none;width:96px}
.tapelog .ev .ms{color:#E7DCC6;opacity:.85}
.tapelog .empty{padding:26px 14px;font-size:12.5px;color:#9C9080;text-align:center}

/* empty state */
.empty-card{text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:48px 28px;margin-top:24px}
.empty-card h3{font-family:var(--font-display);font-weight:600;font-size:24px;margin-top:18px}
.empty-card p{color:var(--ink-2);font-size:15px;margin:8px auto 0;max-width:420px;font-weight:500}

/* loaders */
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--rust);border-radius:50%;animation:rot .8s linear infinite;margin:40px auto}
@keyframes rot{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,var(--paper-2) 25%,#EFE3CC 50%,var(--paper-2) 75%);
  background-size:200% 100%;animation:shim 1.3s infinite;border-radius:10px}
@keyframes shim{to{background-position:-200% 0}}

/* footer */
.ftr{border-top:1px solid var(--line);margin-top:40px;padding:38px 0;background:var(--paper-2)}
.ftr-in{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.ftr .grounded{font-family:var(--font-display);font-style:italic;font-size:18px;color:var(--ink)}
.ftr .legal{font-size:12.5px;color:var(--ink-3);max-width:460px;margin-top:6px;line-height:1.5}
.ftr .lk{display:flex;gap:18px;font-weight:600;font-size:14px;color:var(--ink-2)}
.ftr .lk a:hover{color:var(--rust)}

.reveal{animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

@media(max-width:880px){
  .hero-grid{grid-template-columns:1fr}.hero-art{display:none}
  .statstrip{grid-template-columns:1fr 1fr}.funnel{grid-template-columns:1fr 1fr}
  .fstep::after{display:none}.acts{grid-template-columns:1fr}.eptop{flex-direction:column}
  .nav{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useCallback} = React;
const api = (p,o)=>fetch(p,o).then(r=>r.ok?r.json():Promise.reject(r));
const nf = n => (n||0).toLocaleString();

/* ---------- icons ---------- */
const I = {
  search:(p)=><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" {...p}><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>,
  arrow:(p)=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M5 12h14m-6-6 6 6-6 6"/></svg>,
  clock:(p)=><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" {...p}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>,
  play:(p)=><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" {...p}><path d="M7 5.5v13l11-6.5z"/></svg>,
  github:(p)=><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" {...p}><path d="M12 1.5C6.2 1.5 1.5 6.3 1.5 12.2c0 4.7 3 8.7 7.2 10.1.5.1.7-.2.7-.5v-1.7c-2.9.6-3.5-1.4-3.5-1.4-.5-1.2-1.2-1.6-1.2-1.6-1-.6.1-.6.1-.6 1 .1 1.6 1.1 1.6 1.1.9 1.6 2.4 1.1 3 .9.1-.7.4-1.1.6-1.4-2.3-.3-4.7-1.2-4.7-5.2 0-1.1.4-2.1 1.1-2.8-.1-.3-.5-1.4.1-2.9 0 0 .9-.3 2.9 1.1.8-.2 1.7-.3 2.6-.3.9 0 1.8.1 2.6.3 2-1.4 2.9-1.1 2.9-1.1.6 1.5.2 2.6.1 2.9.7.7 1.1 1.7 1.1 2.8 0 4-2.4 4.9-4.7 5.2.4.3.7 1 .7 2v3c0 .3.2.6.7.5 4.2-1.4 7.2-5.4 7.2-10.1C22.5 6.3 17.8 1.5 12 1.5z"/></svg>,
};
const Mascot = ({size=44})=>(
  <svg className="mascot" width={size} height={size*0.5} viewBox="0 0 440 220" aria-label="Podcast Search">
    <path d="M100 145Q100 45 220 38Q340 45 340 145" fill="none" stroke="var(--rust)" strokeWidth="18" strokeLinecap="round"/>
    <rect x="68" y="118" width="50" height="68" rx="14" fill="var(--rust)"/><rect x="74" y="124" width="38" height="56" rx="10" fill="var(--mustard)"/><rect x="80" y="131" width="26" height="42" rx="7" fill="var(--rust)"/>
    <rect x="322" y="118" width="50" height="68" rx="14" fill="var(--rust)"/><rect x="328" y="124" width="38" height="56" rx="10" fill="var(--mustard)"/><rect x="334" y="131" width="26" height="42" rx="7" fill="var(--rust)"/>
    <circle cx="170" cy="155" r="42" fill="none" stroke="var(--rust)" strokeWidth="8"/><circle cx="170" cy="155" r="34" fill="var(--paper)"/>
    <circle className="eyeball" cx="170" cy="155" r="22" fill="var(--ink)"/>
    <circle cx="270" cy="155" r="42" fill="none" stroke="var(--rust)" strokeWidth="8"/><circle cx="270" cy="155" r="34" fill="var(--paper)"/>
    <circle className="eyeball b" cx="270" cy="155" r="22" fill="var(--ink)"/>
  </svg>
);
const Eq = ()=> <span className="eq"><i/><i/><i/><i/><i/></span>;
const fmtTime = s => { if(s==null) return null; const m=Math.floor(s/60),x=Math.floor(s%60); return m+':'+String(x).padStart(2,'0'); };

/* ---------- routing ---------- */
function useRoute(){
  const [r,setR]=useState(window.location.hash||'#/');
  useEffect(()=>{const f=()=>setR(window.location.hash||'#/');window.addEventListener('hashchange',f);return()=>window.removeEventListener('hashchange',f);},[]);
  return r;
}
const go = h => { window.location.hash=h; };

/* ================= HEADER ================= */
function Header({route,live}){
  const tab = route.startsWith('#/library')?'lib':route.startsWith('#/pipeline')?'pipe':route.startsWith('#/episode')?'':'disc';
  return (
    <header className="hdr"><div className="wrap hdr-in">
      <div className="brand" onClick={()=>go('#/')}>
        <Mascot size={40}/>
        <span className="brand-name">podcast<b>·</b>search</span>
      </div>
      <nav className="nav">
        <a className={tab==='disc'?'on':''} onClick={()=>go('#/')}>Discover</a>
        <a className={tab==='lib'?'on':''} onClick={()=>go('#/library')}>The Shelf</a>
        <a className={tab==='pipe'?'on':''} onClick={()=>go('#/pipeline')}>Pipeline</a>
      </nav>
      <div className="hdr-right">
        {live && <span className="live-pill"><span className="dot"></span>transcribing</span>}
        <a className="ic-link" href="https://github.com/ankitaggarwal/podsearch.space" target="_blank" rel="noopener"><I.github/></a>
      </div>
    </div></header>
  );
}

/* ================= SEARCH BAR ================= */
function SearchBar({big,defaultValue=''}){
  const [q,setQ]=useState(defaultValue);
  const submit=e=>{e.preventDefault(); if(q.trim()) go('#/search?q='+encodeURIComponent(q.trim()));};
  return (
    <form className="searchbar" onSubmit={submit} style={big?{}:{maxWidth:'100%'}}>
      <I.search style={{color:'var(--ink-3)',flex:'none'}}/>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Ask the shelf anything — “how do they think about pricing?”" autoFocus={big}/>
      <button className="go" type="submit" aria-label="Search"><I.arrow/></button>
    </form>
  );
}
const EXAMPLES=["how do they think about pricing?","advice for a first PM hire","what makes a great product manager?","how do they find product–market fit?"];
const TOPICS=["pricing","hiring","product-market fit","fundraising","roadmaps","user research","growth loops","positioning","leadership","saying no"];

/* ================= DISCOVER ================= */
function Discover({stats,live}){
  const [lib,setLib]=useState(null);
  useEffect(()=>{api('/api/library').then(setLib).catch(()=>setLib({podcasts:[]}));},[]);
  const shows=(lib&&lib.podcasts)||[];
  const recent=shows.flatMap(s=>s.episodes.map(e=>({...e,show:s.title}))).slice(0,8);
  return (
    <main>
      <section className="hero wrap">
        <div className="hero-grid">
          <div className="reveal">
            <span className="kicker"><Eq/> grounded · cited · searchable</span>
            <h1>Ask a shelf of podcasts.<br/>Get an <em>answer you can <span className="u">trust<svg viewBox="0 0 200 12" preserveAspectRatio="none"><path d="M2 8 Q50 2 100 7 T198 5" stroke="currentColor" strokeWidth="4" fill="none" strokeLinecap="round"/></svg></span></em>.</h1>
            <p className="lead">Every answer is built only from real transcripts — with the exact episode and timestamp behind every claim. Discover what was <em>actually said</em>, not what a model guessed.</p>
            <SearchBar big/>
            <div className="examples">
              <span className="ex-lbl">try ↘</span>
              {EXAMPLES.map(x=><button key={x} className="chip" onClick={()=>go('#/search?q='+encodeURIComponent(x))}>{x}</button>)}
            </div>
          </div>
          <div className="hero-art reveal" style={{animationDelay:'.12s'}}>
            <div className="disc">
              <span className="ring" style={{width:300,height:300}}></span>
              <span className="ring" style={{width:220,height:220,animationDuration:'34s',animationDirection:'reverse'}}></span>
              <Mascot size={190}/>
            </div>
          </div>
        </div>
        <div className="statstrip reveal" style={{animationDelay:'.2s'}}>
          {[['shows',stats?.shows,'shows on the shelf'],['episodes',stats?.episodes,'episodes transcribed'],['hours',stats?.hours,'hours searchable'],['vectors',stats?.vectors,'passages indexed']].map(([k,v,l],i)=>(
            <div className="cell" key={k}><div className="num">{v==null?'—':nf(v)}</div><div className="lbl">{l}</div></div>
          ))}
        </div>
      </section>

      <section className="sec wrap">
        <div className="sec-head"><div><h2>Browse the shelf</h2><p>The shows wired in — ask within any one of them.</p></div>
          <a className="see-all" onClick={()=>go('#/library')}>all shows <I.arrow/></a></div>
        {lib===null? <div className="shelf">{Array.from({length:8}).map((_,i)=><div key={i} className="show"><div className="cover skel"></div><div className="skel" style={{height:14,marginTop:11}}></div></div>)}</div>
         : shows.length? <div className="shelf">{shows.slice(0,12).map((s,i)=>(
            <div className="show reveal" key={s.title} style={{animationDelay:(i*.03)+'s'}} onClick={()=>go('#/library')}>
              <div className="cover">{s.image_url? <img src={s.image_url} alt=""/> : <Mascot size={64}/>}</div>
              <div className="nm">{s.title}</div><div className="ct">{s.episode_count} ep{s.episode_count!==1?'s':''}</div>
            </div>))}</div>
         : <EmptyShelf live={live}/>}
      </section>

      <section className="sec wrap">
        <div className="sec-head"><div><h2>Explore by topic</h2><p>Jump straight into a question the operators keep circling back to.</p></div></div>
        <div className="examples" style={{maxWidth:'100%'}}>
          {TOPICS.map(t=><button key={t} className="chip" onClick={()=>go('#/search?q='+encodeURIComponent(t))}>#{t}</button>)}
        </div>
      </section>

      {recent.length>0 &&
      <section className="sec wrap">
        <div className="sec-head"><div><h2>Fresh transcripts</h2><p>Recently turned from audio into something you can search.</p></div></div>
        <div className="eps">{recent.map((e,i)=>(
          <div className="epcard reveal" key={e.episode_id} style={{animationDelay:(i*.03)+'s'}} onClick={()=>go('#/episode/'+e.episode_id)}>
            <div className="th">{e.image_url? <img src={e.image_url} alt=""/> : <Mascot size={36}/>}</div>
            <div><div className="tt">{e.title}</div><div className="sh">{e.show}</div></div>
          </div>))}</div>
      </section>}
    </main>
  );
}
function EmptyShelf({live}){
  return <div className="empty-card"><Mascot size={72}/>
    <h3>The shelf is still filling up</h3>
    <p>{live? "Episodes are being transcribed right now — watch it happen on the Pipeline page." : "No episodes are indexed yet. The transcription pipeline populates the shelf as it runs."}</p>
    <div style={{marginTop:20}}><button className="btn rust" onClick={()=>go('#/pipeline')}>See the pipeline <I.arrow/></button></div>
  </div>;
}

/* ================= SEARCH RESULTS ================= */
function SearchView({q}){
  const [state,setState]=useState({loading:true});
  useEffect(()=>{let on=true;setState({loading:true});
    api('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})})
      .then(d=>on&&setState({loading:false,data:d})).catch(()=>on&&setState({loading:false,err:true}));
    return()=>{on=false};},[q]);
  const html = state.data?.answer ? DOMPurify.sanitize(marked.parse(state.data.answer)) : '';
  const sources=state.data?.sources||[];
  const noHits = state.data && (!sources.length || /no relevant content/i.test(state.data.answer||''));
  return (
    <main className="wrap"><div className="results">
      <span className="kicker" style={{cursor:'pointer'}} onClick={()=>go('#/')}>← back to discover</span>
      <h2 className="askedq" style={{marginTop:14}}>“{q}”</h2>
      {state.loading && <><div className="grounded-tag"><Eq/> reading the transcripts…</div><div className="spin"></div></>}
      {state.err && <div className="empty-card"><h3>The search engine is unreachable</h3><p>The answer service didn’t respond. This usually means the inference gateway is offline — try again in a moment.</p></div>}
      {state.data && !state.loading && (noHits
        ? <div className="empty-card"><Mascot size={64}/><h3>Nothing on the shelf covers that — yet</h3><p>Either the transcripts don’t discuss this, or the library is still being indexed. It won’t invent an answer it can’t cite.</p><div style={{marginTop:18}}><button className="btn" onClick={()=>go('#/pipeline')}>Check the pipeline <I.arrow/></button></div></div>
        : <>
          <div className="grounded-tag">grounded, not generative — built only from the excerpts below</div>
          <div className="answer reveal" dangerouslySetInnerHTML={{__html:html}}/>
          {sources.length>0 && <>
            <div className="receipts-h">the receipts · {sources.length} source{sources.length!==1?'s':''}</div>
            {sources.map((s,i)=>(
              <div className="receipt reveal" key={i} style={{animationDelay:(i*.04)+'s'}} onClick={()=>go('#/episode/'+s.episode_id)}>
                <div className="rk">{i+1}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div className="rt">{s.episode_title||'Episode'}</div>
                  {s.text && <div className="rx">“{s.text}”</div>}
                  <div className="rm">
                    {s.podcast_title && <span>{s.podcast_title}</span>}
                    {s.start_time!=null && <span style={{display:'inline-flex',alignItems:'center',gap:4}}><I.clock/> {fmtTime(s.start_time)}</span>}
                    {s.score!=null && <span style={{display:'inline-flex',alignItems:'center',gap:6}}><span className="score-bar"><i style={{width:Math.min(100,Math.round((s.score)*100))+'%'}}></i></span>{(s.score).toFixed(2)}</span>}
                    <span style={{marginLeft:'auto',color:'var(--rust)',fontWeight:600,display:'inline-flex',alignItems:'center',gap:4}}>open <I.arrow/></span>
                  </div>
                </div>
              </div>))}
          </>}
        </>)}
    </div></main>
  );
}

/* ================= LIBRARY ================= */
function Library(){
  const [lib,setLib]=useState(null);const[open,setOpen]=useState(null);
  useEffect(()=>{api('/api/library').then(setLib).catch(()=>setLib({podcasts:[]}));},[]);
  const shows=(lib&&lib.podcasts)||[];
  return (
    <main className="wrap"><section className="sec" style={{borderTop:'none'}}>
      <div className="sec-head"><div><span className="kicker">the shelf</span><h2 style={{marginTop:8}}>Every show, every episode</h2><p>{lib? shows.length+' shows indexed' : 'loading…'}</p></div></div>
      {lib===null? <div className="spin"></div>
       : !shows.length? <EmptyShelf/>
       : <div style={{display:'flex',flexDirection:'column',gap:12}}>{shows.map(s=>(
          <div key={s.title} style={{background:'var(--card)',border:'1px solid var(--line)',borderRadius:'var(--r)',overflow:'hidden'}}>
            <div style={{display:'flex',gap:15,alignItems:'center',padding:16,cursor:'pointer'}} onClick={()=>setOpen(open===s.title?null:s.title)}>
              <div className="th" style={{width:52,height:52}}>{s.image_url?<img src={s.image_url} alt=""/>:<Mascot size={30}/>}</div>
              <div style={{flex:1}}><div style={{fontWeight:700,fontSize:16}}>{s.title}</div><div style={{fontSize:13,color:'var(--ink-3)',fontFamily:'var(--font-mono)',marginTop:2}}>{s.episode_count} episode{s.episode_count!==1?'s':''}</div></div>
              <span style={{color:'var(--rust)',transform:open===s.title?'rotate(90deg)':'',transition:'.2s'}}><I.arrow/></span>
            </div>
            {open===s.title && <div style={{borderTop:'1px solid var(--line)',padding:'6px 8px'}}>{s.episodes.map(e=>(
              <div key={e.episode_id} onClick={()=>go('#/episode/'+e.episode_id)} style={{padding:'11px 14px',borderRadius:10,cursor:'pointer',fontWeight:500,fontSize:14.5,display:'flex',gap:10,alignItems:'center'}} onMouseEnter={ev=>ev.currentTarget.style.background='var(--paper-2)'} onMouseLeave={ev=>ev.currentTarget.style.background=''}>
                <I.play style={{color:'var(--rust)',flex:'none'}}/>{e.title}</div>))}</div>}
          </div>))}</div>}
    </section></main>
  );
}

/* ================= EPISODE ================= */
function Episode({id}){
  const [ep,setEp]=useState(undefined);const[sum,setSum]=useState(null);
  useEffect(()=>{let on=true;setEp(undefined);setSum(null);
    api('/api/episodes/'+id).then(d=>on&&setEp(d)).catch(()=>on&&setEp(null));
    api('/api/episodes/'+id+'/summary').then(d=>on&&setSum(d.summary||'')).catch(()=>on&&setSum(''));
    return()=>{on=false};},[id]);
  if(ep===undefined) return <main className="wrap"><div className="spin"></div></main>;
  if(ep===null) return <main className="wrap"><div className="empty-card" style={{marginTop:60}}><h3>Episode not found</h3><p>It may not be indexed yet.</p><div style={{marginTop:16}}><button className="btn" onClick={()=>go('#/library')}>Back to the shelf</button></div></div></main>;
  return (
    <main className="wrap">
      <span className="kicker" style={{cursor:'pointer',display:'inline-block',marginTop:24}} onClick={()=>history.length>1?history.back():go('#/library')}>← back</span>
      <div className="eptop">
        <div className="big">{ep.image_url?<img src={ep.image_url} alt=""/>:<Mascot size={72}/>}</div>
        <div style={{flex:1}}>
          <div style={{color:'var(--rust)',fontWeight:700,fontSize:14}}>{ep.podcast_title}</div>
          <h1>{ep.title}</h1>
          <div style={{display:'flex',gap:12,marginTop:18,flexWrap:'wrap'}}>
            {ep.audio_url && <a className="btn rust" href={ep.audio_url} target="_blank" rel="noopener"><I.play/> Listen to the full episode</a>}
            <button className="btn" style={{background:'var(--card)',color:'var(--ink)',border:'1px solid var(--ink)',boxShadow:'none'}} onClick={()=>go('#/search?q='+encodeURIComponent(ep.title))}><I.search/> Ask about this</button>
          </div>
        </div>
      </div>
      <div className="summary">
        <div className="lbl">the gist</div>
        {sum===null? <div style={{marginTop:12}}><div className="skel" style={{height:16,marginBottom:8}}></div><div className="skel" style={{height:16,width:'80%'}}></div></div>
         : sum? <p>{sum}</p>
         : <p style={{color:'var(--ink-3)',fontSize:16,fontFamily:'var(--font-body)',fontWeight:500}}>A summary isn’t available right now — head to the original episode to listen, or ask a question about it above.</p>}
      </div>
      <p style={{fontSize:12.5,color:'var(--ink-3)',marginTop:16,fontStyle:'italic'}}>Search surfaces short, cited excerpts only. Not affiliated with this show — please support the creators by listening to the original episode.</p>
    </main>
  );
}

/* ================= PIPELINE / STATS ================= */
function Pipeline({stats}){
  const [events,setEvents]=useState([]);const[status,setStatus]=useState(null);
  useEffect(()=>{let on=true;const tick=()=>{
    api('/api/crawler/events').then(d=>on&&setEvents((d.events||d||[]).slice(-40).reverse())).catch(()=>{});
    api('/api/crawler/status').then(d=>on&&setStatus(d)).catch(()=>{});};
    tick();const t=setInterval(tick,4000);return()=>{on=false;clearInterval(t)};},[]);
  const s=stats||{};
  const funnel=[
    ['b1','feeds',s.feeds,'product RSS sources'],
    ['b3','transcribed',s.episodes,'episodes · audio → text'],
    ['b4','chunks',s.chunks,'~1k-char passages'],
    ['b5','vectors',s.vectors,'searchable in Qdrant'],
  ];
  return (
    <main className="wrap">
      <section className="pipe-hero">
        <span className="kicker" style={{justifyContent:'center',display:'flex'}}><Eq/> how the shelf gets built</span>
        <h1>From a wall of audio to a cited answer.</h1>
        <p>One pipeline, three acts: <b>sound → text</b>, <b>text → searchable meaning</b>, <b>meaning → a cited answer.</b> Here’s what’s flowed through it.</p>
      </section>

      <div className="funnel">
        {funnel.map(([b,k,v,l])=>(
          <div className={'fstep '+b} key={k}>
            <div className="fk">{k}</div>
            <div className="fn">{v==null?'—':typeof v==='string'?v:nf(v)}</div>
            <div className="fl">{l}</div>
          </div>))}
      </div>

      <div className="acts">
        <div className="act"><h3><span style={{color:'var(--rust)'}}>♪</span> Act I · Ingest</h3>
          <p>Read {s.feeds||'—'} RSS feeds, resolve each episode’s real audio, round-robin across shows, and dedupe — then transcribe with a self-hosted Parakeet model.</p>
          <div className="tag" style={{marginTop:12}}>RSS · audio · transcribe</div></div>
        <div className="act"><h3><span style={{color:'var(--mustard-d)'}}>◈</span> Act II · Index</h3>
          <p>Cut each transcript into ~1,000-char passages (timestamps carried forward), embed them with embeddinggemma, and upsert the vectors to Qdrant.</p>
          <div className="tag" style={{marginTop:12}}>chunk · embed · store</div></div>
        <div className="act"><h3><span style={{color:'var(--teal-d)'}}>✦</span> Act III · Answer</h3>
          <p>Embed your question, pull the nearest passages, re-rank with a keyword boost, and let Gemma 4 write an answer using <em>only</em> those excerpts — citing each one.</p>
          <div className="tag" style={{marginTop:12}}>retrieve · ground · cite</div></div>
      </div>

      <div className="tapelog">
        <div className="bar"><Mascot size={22}/> <span>live crawler</span>
          <span style={{marginLeft:'auto'}}>{status?.active? <span style={{color:'var(--mustard)'}}>● running</span>:'idle'}</span></div>
        <div className="feed">
          {events.length? events.map((e,i)=>(
            <div className="ev" key={i}><span className="ph">{e.phase||e.type||'·'}</span><span className="ms">{e.message||e.episode||''}</span></div>
          )) : <div className="empty">No activity right now. When the pipeline runs, every step streams here — discovery, transcription, embedding, and the occasional skip.</div>}
        </div>
      </div>
      <p style={{textAlign:'center',marginTop:22}}><a className="see-all" href="https://github.com/ankitaggarwal/podsearch.space/blob/main/ARCHITECTURE.md" target="_blank" rel="noopener">read the full architecture <I.arrow/></a></p>
    </main>
  );
}

/* ================= FOOTER ================= */
function Footer(){
  return <footer className="ftr"><div className="wrap ftr-in">
    <div>
      <div className="grounded">Retrieval is the product. The model is the garnish.</div>
      <div className="legal">Not affiliated with any of these shows. Transcripts and excerpts are used for search and discovery, with links back to the original episodes — please support the creators by listening there.</div>
    </div>
    <div className="lk">
      <a onClick={()=>go('#/pipeline')}>Pipeline</a>
      <a href="https://github.com/ankitaggarwal/podsearch.space" target="_blank" rel="noopener">GitHub</a>
      <a href="https://github.com/ankitaggarwal/podsearch.space/blob/main/LICENSE" target="_blank" rel="noopener">MIT</a>
    </div>
  </div></footer>;
}

/* ================= APP ================= */
function App(){
  const route=useRoute();
  const [stats,setStats]=useState(null);
  useEffect(()=>{const f=()=>api('/api/stats').then(setStats).catch(()=>{});f();const t=setInterval(f,15000);return()=>clearInterval(t);},[]);
  useEffect(()=>{window.scrollTo(0,0);},[route]);
  const [crawlerLive,setCrawlerLive]=useState(false);
  useEffect(()=>{const f=()=>api('/api/crawler/status').then(d=>setCrawlerLive(!!d.active)).catch(()=>{});f();const t=setInterval(f,8000);return()=>clearInterval(t);},[]);

  let view;
  if(route.startsWith('#/search')){const q=decodeURIComponent((route.split('?q=')[1]||''));view=<SearchView q={q} key={q}/>;}
  else if(route.startsWith('#/library')) view=<Library/>;
  else if(route.startsWith('#/pipeline')) view=<Pipeline stats={stats}/>;
  else if(route.startsWith('#/episode/')) view=<Episode id={route.split('#/episode/')[1]} key={route}/>;
  else view=<Discover stats={stats} live={crawlerLive}/>;

  return <>
    <Header route={route} live={crawlerLive}/>
    {view}
    <Footer/>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
